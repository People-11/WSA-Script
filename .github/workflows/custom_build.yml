name: Custom Build
run-name: WSA ${{ inputs.release_type }} ${{ inputs.arch }} with ${{ inputs.root_sol }} and ${{ inputs.gapps_brand }}
on:
  workflow_dispatch:
    inputs:
      arch:
        type: choice
        description: Target CPU architecture of WSA.
        required: true
        options: [ x64, arm64 ]
        default: x64
      release_type:
        type: choice
        description: WSA Release Channel
        required: true
        options: [ "Retail", "Release Preview", "Insider Slow", "Insider Fast", "Insider Private" ]
        default: "Retail"
      user_code:
        type: string
        description: User code for WSA Insider User (Optional)
        required: false
        default: ""
      gapps_brand:
        type: choice
        description: Google Apps brand
        required: true
        options: [ "MindTheGapps v13.0", "No GApps" ]
        default: "No GApps"
      root_sol:
        type: choice
        description: Root solution
        required: true
        options: [ "Non-root", "KernelSU", "Magisk Official", "Magisk Alpha (vvb2060)" ]
        default: "KernelSU"
      magisk_channel:
        type: choice
        description: Magisk channel
        required: true
        options: [ "Magisk Stable", "Magisk Beta", "Magisk Canary", "Magisk Debug" ]
        default: "Magisk Stable"
      compression:
        type: choice
        description: Compression format.
        required: true
        options: [ ".zip", ".7z" ]
        default: ".7z"
      remove_amazon:
        description: "Remove Amazon Appstore from the system"
        required: true
        default: true
        type: boolean
      debloat:
        description: "Disable unneeded system apps (see scripts/debloat.list)"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build WSA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ♻️
        uses: actions/checkout@v7

      - name: Setup Python 👷
        uses: actions/setup-python@v7
        with:
          check-latest: true
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/

      - name: Setup Python3 Virtual Enviroment 🐍
        working-directory: scripts
        run: |
          sudo apt-get update
          PYTHON_VENV_DIR="$(dirname "$PWD")/python3-env"
          python3 -m venv "$PYTHON_VENV_DIR"
          # shellcheck disable=SC1091
          source "$PYTHON_VENV_DIR/bin/activate"
          python3 -m pip install --upgrade -r requirements.txt
          deactivate

      - name: Install Ubuntu Dependencies 🧑‍🏭
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: e2fsprogs attr unzip qemu-utils python3-venv
          version: 1.0

      - name: Build WSA 🏗️
        id: wsa
        run: |
          declare -A opts=( ["RELEASE_TYPE,Retail"]="retail" ["RELEASE_TYPE,Release Preview"]="RP" ["RELEASE_TYPE,Insider Slow"]="WIS" ["RELEASE_TYPE,Insider Fast"]="WIF" ["RELEASE_TYPE,Insider Private"]="latest" ["ROOT_SOL,Magisk Official"]="topjohnwu" ["ROOT_SOL,Magisk Alpha (vvb2060)"]="vvb2060" ["ROOT_SOL,KernelSU"]="kernelsu" ["ROOT_SOL,Non-root"]="none" ["MAGISK_TYPE,Magisk Stable"]="stable" ["MAGISK_TYPE,Magisk Beta"]="beta" ["MAGISK_TYPE,Magisk Canary"]="canary" ["MAGISK_TYPE,Magisk Debug"]="debug" ["REMOVE_AMAZON,true"]="--remove-amazon" ["DEBLOAT,true"]="--debloat" ["GAPPS_BRAND,MindTheGapps v13.0"]="--install-gapps" )

          mkdir -p download
          echo -e "user_code=$(cat $GITHUB_EVENT_PATH | jq -r '.inputs.user_code')" > download/.ms_account

          if [[ "${{ inputs.root_sol }}" == *Magisk* ]]; then
              MAGISK_BRANCH="${opts[ROOT_SOL,${{ inputs.root_sol }}]}"
              ROOT_SOL="magisk"
              BUILD_SCRIPT=./scripts/build_with_lspinit.sh
          else
              MAGISK_BRANCH="topjohnwu"
              ROOT_SOL="${opts[ROOT_SOL,${{ inputs.root_sol }}]}"
              BUILD_SCRIPT=./scripts/build_with_mount.sh
          fi
          $BUILD_SCRIPT --arch ${{ inputs.arch }} --release-type ${opts[RELEASE_TYPE,${{ inputs.release_type }}]} --magisk-branch "$MAGISK_BRANCH" --magisk-ver "${opts[MAGISK_TYPE,${{ inputs.magisk_channel }}]}" --root-sol $ROOT_SOL ${opts[GAPPS_BRAND,${{ inputs.gapps_brand }}]} ${opts[REMOVE_AMAZON,${{ inputs.remove_amazon }}]} ${opts[DEBLOAT,${{ inputs.debloat }}]}

      - name: Install Houdini 🪄
        if: inputs.arch == 'x64'
        run: bash ./libhoudini/houdini_installer.sh "${{ steps.wsa.outputs.artifact }}"

      - name: Pass to Windows 💸
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.wsa.outputs.artifact }}-${{ steps.wsa.outputs.built }}
          path: output

    outputs:
      artifact: ${{ steps.wsa.outputs.artifact }}
      built: ${{ steps.wsa.outputs.built }}

  make-pri:
    name: Merge PRI resources
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download built artifact ⌛
        uses: actions/download-artifact@v8
        with:
          path: output
          name: ${{ needs.build.outputs.artifact }}-${{ needs.build.outputs.built }}

      - name: Remove unused artifact ❌
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: ${{ needs.build.outputs.artifact }}-${{ needs.build.outputs.built }}

      - name: Merge language and density resources 🧙🏻‍♂️
        run: |
          $Dir = "${{ github.workspace }}\output\${{ needs.build.outputs.artifact }}"
          # Use the newest installed SDK; the runner image drops old SDK versions over time
          $MakePri = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\${{ inputs.arch }}\makepri.exe" | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $MakePri) { throw "makepri.exe not found in Windows SDK" }
          Copy-Item -Force $MakePri.FullName $Dir
          # arm64 makepri can't run here; Install.ps1 runs MakePri.ps1 on the user's machine
          if ("${{ inputs.arch }}" -eq "x64") {
            Push-Location $Dir
            pwsh -ExecutionPolicy Bypass -File MakePri.ps1
            Pop-Location
          }

      - name: Compact Images 💿
        run: |
         foreach ($Partition in 'system','product','system_ext','vendor') {
             Write-Output "Optimizing of $Partition..."
             Write-Output "SELECT VDISK FILE=`"${{ github.workspace }}\output\${{ needs.build.outputs.artifact }}\$Partition.vhdx`"`
             ATTACH VDISK READONLY`
             COMPACT VDISK`
             DETACH VDISK" | Set-Content -Path "$Partition.txt" -Encoding Ascii
             Start-Process -NoNewWindow -Wait "diskpart.exe" -Args "/s $Partition.txt" -RedirectStandardOutput NUL
         }

      - name: Compress 7-Zip and Add checksum ✔️
        if: inputs.compression == '.7z'
        working-directory: output
        run: |
          7z a -t7z -mx=6 -m0=LZMA2 -ms=on -mmt=8 -sdel -- "${{ needs.build.outputs.artifact }}.7z" "${{ needs.build.outputs.artifact }}\*"
          ($(Get-FileHash -Path "${{ needs.build.outputs.artifact }}.7z" -Algorithm SHA256).Hash.ToLower().ToString() + "  " + "${{ needs.build.outputs.artifact }}.7z") | Out-File -FilePath sha256-checksum.txt -Encoding UTF8

      - name: Upload Artifact 📦
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}-compressed
          path: output
